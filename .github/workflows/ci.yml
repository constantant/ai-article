name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Sets NX_BASE/NX_HEAD correctly for both PR and push events, so
      # `nx affected` only runs targets for what actually changed.
      - uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD
      - run: npx nx affected -t lint,typecheck,test,build --base=$NX_BASE --head=$NX_HEAD
